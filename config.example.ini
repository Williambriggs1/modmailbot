# Required settings
# -----------------
token = REPLACE_WITH_TOKEN
mainServerId = REPLACE_WITH_MAIN_SERVER_ID
inboxServerId = REPLACE_WITH_INBOX_SERVER_ID
logChannelId = REPLACE_WITH_LOG_CHANNEL_ID

# Common settings
# ----------------------------------
prefix = !
inboxServerPermission = manageMessages
status = Message me for help!
responseMessage = Thank you for your message! Our mod team will reply to you here as soon as possible.

# Optional modular application tickets
# ----------------------------------
# Each application type can use its own questions, private category, and staff roles allowed to start it.
# The category's Discord permission overwrites determine who can SEE/review that application.
# Separate questions and role IDs with || in INI configs.
#
# applications.enabled = true
# applications.defaultType = support
#
# applications.types.support.name = Support Team Application
# applications.types.support.categoryId = REPLACE_WITH_SUPPORT_APPLICATION_CATEGORY_ID
# applications.types.support.startRoles = REPLACE_WITH_SUPPORT_LEAD_ROLE_ID||REPLACE_WITH_MANAGEMENT_ROLE_ID
# applications.types.support.introMessage = 🍓 Support Team Application - Please answer each question in one message.
# applications.types.support.completionMessage = 🍓 Support application complete! Your answers are ready for review.
# applications.types.support.questions = What is your Minecraft username?||What timezone are you in?||Why are you interested in Support?||How would you respond to an upset player?||How active are you usually?||Is there anything else you would like us to know?
#
